spring.application.name=espacioya-backend
server.port=${PORT:8080}

# Base de datos. Los valores por defecto apuntan al PostgreSQL local de
# 1_Database/compose.yaml; en UAT se pasan por variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/espacioya}
spring.datasource.username=${DB_USUARIO:espacioya}
spring.datasource.password=${DB_CONTRASENA:espacioya}

# El esquema lo crean solo las migraciones de Flyway (db/migration).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
