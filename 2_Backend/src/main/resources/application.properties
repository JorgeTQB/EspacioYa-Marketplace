spring.application.name=espacioya-backend
server.port=${PORT:8080}

# Base de datos. Los valores por defecto apuntan al PostgreSQL local de
# 1_Database/compose.yaml; en UAT se pasan por variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/espacioya}
spring.datasource.username=${DB_USUARIO:espacioya}
spring.datasource.password=${DB_CONTRASENA:espacioya}

# El esquema lo crean solo las migraciones de Flyway (db/migration).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Las migraciones se numeran por sprint (docs/conventions.md) y las historias no terminan en orden:
# una V1_n puede llegar a develop después de una V2_n ya aplicada (HU-04, S1). Sin esta propiedad,
# Flyway se niega a arrancar en esa base. La numeración por sprint sigue siendo obligatoria.
spring.flyway.out-of-order=true

# Versión vigente de la política de privacidad y términos (HU-01).
# El registro se rechaza si el cliente envía una versión distinta.
espacioya.privacidad.version-vigente=2026-10

# Origen permitido por CORS: la SPA de 3_frontend. También arma el enlace de recuperación (HU-04).
espacioya.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Envío de correo simulado (HU-04, D1). Solo en desarrollo: con true, el enlace de recuperación se
# escribe en el log para poder probarlo sin correo real. Nunca true en UAT.
espacioya.correo.simulado.registrar-enlace=${CORREO_SIMULADO_REGISTRAR_ENLACE:false}

# Proveedor de correo (HU-25, D8). smtp o simulado; con otro valor el backend no arranca. UAT: simulado (D12).
# Para SMTP real basta con definir las variables de abajo (docs/architecture.md, "Correo: qué deja HU-25").
# Con smtp, sin remitente o sin host el backend no arranca. La contraseña nunca se escribe en el repositorio.
espacioya.correo.proveedor=${CORREO_PROVEEDOR:simulado}
espacioya.correo.remitente=${CORREO_REMITENTE:}
spring.mail.host=${CORREO_SMTP_HOST:}
spring.mail.port=${CORREO_SMTP_PUERTO:587}
spring.mail.username=${CORREO_SMTP_USUARIO:}
spring.mail.password=${CORREO_SMTP_CONTRASENA:}
# STARTTLS obligatorio (RNF-SEG-13) y timeouts de 5 s: el envío corre tras el commit en el hilo que confirma.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Cifrado de campos sensibles en reposo (HU-02, RNF-SEG-14). Dos llaves distintas de
# 32 bytes en base64 (openssl rand -base64 32). Sin ellas el backend no arranca.
espacioya.cifrado.llave=${CIFRADO_LLAVE:}
espacioya.cifrado.llave-huella=${CIFRADO_LLAVE_HUELLA:}

# Subida de documentos (HU-05). El servicio valida 5 MiB por archivo; este margen deja que
# casi todo exceso llegue al servicio y se informe por campo.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=13MB
server.tomcat.max-swallow-size=20MB

# Almacenamiento privado de archivos (HU-05, RNF-SEG-15). Directorio fuera del repo y de la BD;
# en UAT, un volumen persistente. La llave firma las URL de 5 min: 32 bytes en base64,
# distinta de las de cifrado. Sin ella el backend no arranca.
espacioya.almacenamiento.directorio=${ALMACENAMIENTO_DIRECTORIO:./almacenamiento}
espacioya.almacenamiento.llave-firma=${ALMACENAMIENTO_LLAVE_FIRMA:}

# Dónde se guardan los archivos (HU-29): local (directorio de arriba) o s3. Con otro valor el backend no arranca.
# Con s3, sin bucket o sin región, o si el bucket no existe o no es accesible, el backend no arranca: nunca pasa al disco.
# Las credenciales salen de la cadena por defecto del SDK de AWS (rol de la tarea en Fargate); no se configuran aquí.
espacioya.almacenamiento.tipo=${ALMACENAMIENTO_TIPO:local}
espacioya.almacenamiento.s3.bucket=${ALMACENAMIENTO_S3_BUCKET:}
espacioya.almacenamiento.s3.region=${ALMACENAMIENTO_S3_REGION:}

# Panel admin (HU-06, RNF-SEG-04): solo se entra desde estas IPs; complementa a MFA (HU-17, P3).
# Lista separada por comas de IPs o rangos CIDR. Vacía = nadie entra; 0.0.0.0/0,::/0 = cualquier IP.
# En UAT, las IPs de quienes administran.
espacioya.admin.ips-permitidas=${ADMIN_IPS_PERMITIDAS:127.0.0.1,::1}

# IP real detrás de CloudFront/ALB (HU-06, D3). Tomcat solo cree a X-Forwarded-For si la conexión
# viene de un proxy de confianza (expresión regular). Vacía = nadie es proxy: se usa la IP de la conexión.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${PROXIES_CONFIANZA:}

# Comando de creación de cuentas admin (HU-06, D4). Solo con ADMIN_CREAR=true; las credenciales
# vienen de variables de entorno y nunca se escriben en el repositorio.
espacioya.admin.crear=${ADMIN_CREAR:false}
espacioya.admin.correo=${ADMIN_CORREO:}
espacioya.admin.contrasena=${ADMIN_CONTRASENA:}

# Cupo del catálogo público por IP (HU-10, §9.9 de docs/requerimientos.md): búsqueda (HU-10), ficha y su
# disponibilidad (HU-11) y filtros (HU-23) comparten un solo cupo, con ventana deslizante. La ventana va en
# ISO-8601 (PT1M = 1 minuto). Las zonas y las fotos no cuentan.
espacioya.limite.catalogo.maximo=${LIMITE_CATALOGO_MAXIMO:120}
espacioya.limite.catalogo.ventana=${LIMITE_CATALOGO_VENTANA:PT1M}

# Proceso que expira las reservas sin pago a los 15 minutos (HU-12, D2). El intervalo va en ISO-8601
# (PT1M = 1 minuto). Una reserva vencida deja de ocupar al instante aunque el proceso esté apagado.
espacioya.reservas.expiracion.activa=${RESERVAS_EXPIRACION_ACTIVA:true}
espacioya.reservas.expiracion.intervalo=${RESERVAS_EXPIRACION_INTERVALO:PT1M}

# Recordatorio 24 h antes de cada reserva confirmada (HU-25, D1). Retraso fijo entre pasadas, en ISO-8601.
espacioya.reservas.recordatorios.activa=${RESERVAS_RECORDATORIOS_ACTIVA:true}
espacioya.reservas.recordatorios.intervalo=${RESERVAS_RECORDATORIOS_INTERVALO:PT5M}

# Limpieza de intento_limite vencidos (HU-30). Cada réplica la programa; un bloqueo consultivo evita pasadas dobles.
espacioya.limite.limpieza.activa=${LIMITE_LIMPIEZA_ACTIVA:true}
espacioya.limite.limpieza.intervalo=${LIMITE_LIMPIEZA_INTERVALO:PT10M}

# Pasarela de pago (HU-13). mercadopago o simulada; UAT usa la simulada hasta conectar Mercado Pago (D7 revisada, D8).
# Queda vacía a propósito: sin un valor válido no hay bean de PasarelaPago y el backend no arranca: cada entorno la elige.
espacioya.pagos.pasarela=${PAGOS_PASARELA:}
# Con mercadopago, sin cualquiera de estas tres el backend no arranca. Nunca se escriben en el repositorio.
# Con simulada, secreto-webhook queda vacío en UAT: la ruta pública rechaza todo pago (S16).
espacioya.pagos.llave-secreta=${PAGOS_LLAVE_SECRETA:}
espacioya.pagos.secreto-webhook=${PAGOS_SECRETO_WEBHOOK:}
espacioya.pagos.url-notificacion=${PAGOS_URL_NOTIFICACION:}
espacioya.pagos.url-api=${PAGOS_URL_API:https://api.mercadopago.com}
# El enlace vence este margen antes que la reserva, y en ese tramo no se inicia un pago (D3). ISO-8601.
espacioya.pagos.margen-cierre=${PAGOS_MARGEN_CIERRE:PT1M}
# Solo con simulada (HU-16 D7): las primeras N llamadas de reembolso de cada reembolso fallan, para demostrar el
# reembolso fallido y el reintento del admin sin reiniciar. 0 = ninguna falla. Nunca afecta a mercadopago.
espacioya.pagos.simulada.fallos-reembolso=${PAGOS_SIMULADA_FALLOS_REEMBOLSO:0}
