# Llaves de cifrado SOLO PARA PRUEBAS (HU-02, DT-4). Nunca usar fuera de los tests.
# Spring Boot carga classpath:/config/ encima de classpath:/application.properties.
espacioya.cifrado.llave=cHJ1ZWJhcy1lc3BhY2lveWEtbGxhdmUtYWVzLTAwMDE=
espacioya.cifrado.llave-huella=cHJ1ZWJhcy1lc3BhY2lveWEtbGxhdmUtaG1hYy0wMDI=

# Llave de firma SOLO PARA PRUEBAS (HU-05). Nunca usar fuera de los tests.
espacioya.almacenamiento.llave-firma=cHJ1ZWJhcy1lc3BhY2lveWEtZmlybWEtdXJsLTAwMDM=
espacioya.almacenamiento.directorio=${java.io.tmpdir}/espacioya-it-almacenamiento
# Las IT usan siempre el disco (HU-29), aunque quien las corre tenga ALMACENAMIENTO_TIPO=s3 en su entorno.
espacioya.almacenamiento.tipo=local

# Sin el proceso programado (HU-12): competiría con las limpiezas de las IT. Las pruebas llaman a expirarVencidas().
espacioya.reservas.expiracion.activa=false
# Sin el proceso de recordatorios (HU-25): las pruebas llaman a enviarPendientes().
espacioya.reservas.recordatorios.activa=false
# Sin la limpieza de intento_limite (HU-30): las pruebas llaman a eliminarVencidos().
espacioya.limite.limpieza.activa=false

# Correo sin proveedor real (HU-25, D12): las IT reemplazan EnvioCorreo o NotificadorCorreo con dobles.
espacioya.correo.proveedor=simulado

# Pasarela y secreto SOLO PARA PRUEBAS (HU-13). Nunca usar fuera de los tests.
espacioya.pagos.pasarela=simulada
espacioya.pagos.secreto-webhook=secreto-solo-pruebas
